apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/signifatee/k8s-lab-manifests.git
    targetRevision: main
    path: manifests/test
  destination:
    server: https://kubernetes.default.svc
    namespace: test
    syncOptions:
      - CreateNamespace=true