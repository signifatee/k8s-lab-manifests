apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.projectName }}-deny-ingress
spec:
  podSelector: {}          # пустой селектор = все поды namespace
  policyTypes: {{ .Values.networkPolicy.denyEgress | ternary "[Ingress, Egress]" "[Ingress]" }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.projectName }}-allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53